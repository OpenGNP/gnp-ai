name: Deploy AI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/opengnp/gnp-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/deploy/gnp

          docker compose pull gnp-ai
          docker compose up -d gnp-ai

          # Longer window than gnp-server: loading torch/ML models slows startup.
          for i in $(seq 1 10); do
            sleep 3
            if curl -fsS http://127.0.0.1:8000/; then
              echo "gnp-ai is healthy"
              exit 0
            fi
          done

          echo "gnp-ai did not become healthy after restart" >&2
          docker compose logs --tail=50 gnp-ai >&2
          exit 1

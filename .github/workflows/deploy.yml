name: Deploy AI

# Two systemd workers run from a git checkout on ontario2 (deploy/gnp-ai@.service).
# Self-hosted, because only the faculty network reaches the database and Ollama.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.GNP_AI_DIR || '/home/deploy/gnp-ai' }}

jobs:
  deploy:
    runs-on: [self-hosted, ontario2]
    timeout-minutes: 30
    steps:
      - name: Update the checkout
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --quiet origin main
          OLD=$(git rev-parse HEAD)
          # untracked .env and .venv survive this
          git reset --hard origin/main
          if git diff --quiet "$OLD" HEAD -- pyproject.toml; then
            echo "dependencies unchanged"
          else
            .venv/bin/pip install --quiet -e .
          fi
          git log --oneline -1

      - name: Smoke test
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          # read-only
          .venv/bin/python -m pipeline.run --ingest-only --dry-run
          .venv/bin/python -c "import httpx; from pipeline import config; \
            httpx.get(config.OLLAMA_URL + '/api/version', timeout=5).raise_for_status(); \
            print('ollama reachable at', config.OLLAMA_URL)"

      - name: Restart workers
        run: |
          set -euo pipefail
          # must match /etc/sudoers.d/gnp-ai exactly
          sudo /usr/bin/systemctl restart gnp-ai@ingest.service gnp-ai@cluster.service
          sleep 15
          systemctl is-active gnp-ai@ingest.service gnp-ai@cluster.service
